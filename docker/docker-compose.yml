services:
  frontend:
    build:
      context: ..
      dockerfile: docker/frontend.Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    ports: ["3000:3000"]
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
  backend:
    build:
      context: ..
      dockerfile: docker/backend.Dockerfile
    ports: ["8000:8000"]
    environment:
      - APP_ENV=${APP_ENV:-development}
      - DATABASE_URL=postgresql+psycopg://postgres:${POSTGRES_PASSWORD:-2005}@db:5432/churndb
      - TOKEN_SECRET=${TOKEN_SECRET:-local-development-secret-change-before-deploy}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-likitharai22@gmail.com}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-ChangeMe123!}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000}
      - APP_BASE_URL=${APP_BASE_URL:-http://localhost:3000}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM=${SMTP_FROM:-}
      - SMTP_USE_TLS=${SMTP_USE_TLS:-true}
      - SMTP_USE_SSL=${SMTP_USE_SSL:-false}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: churndb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-2005}
    ports: ["5433:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ../database/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d churndb"]
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  pgdata:
